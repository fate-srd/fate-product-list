name: Version Bump

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - "main"

permissions:
  contents: write

jobs:
  check_and_bump_version:
    if: github.event_name == "workflow_dispatch" || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup nodejs
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - run: npm ci

      - name: Bump version if product list changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo The PR was merged

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]
          then
            BASE_SHA=$(git rev-parse HEAD~1)
            HEAD_SHA=$(git rev-parse HEAD)
          else
            BASE_SHA=${{ toJson(github.event.pull_request.base.sha) }}
            HEAD_SHA=${{ toJson(github.event.pull_request.head.sha) }}
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep fate-product-list.csv
          then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if npm version major -m "Version updated to %s because product list changed."
            then
              VERSION=$(jq -r .version package.json)
              echo "Version updated to $VERSION."
              git push --follow-tags origin HEAD:main

              if gh release view "v$VERSION" >/dev/null 2>&1
              then
                echo "Release v$VERSION already exists; skipping."
              else
                gh release create "v$VERSION" \
                  --title "Release v$VERSION" \
                  --notes "## Changes in v$VERSION

          This is an automated release triggered by the Version Bump workflow.

          **New version:** $VERSION

          Please check the commit history for detailed changes."
              fi
            else
              echo "Couldn't update version for some reason."
            fi
          else
            echo "No changes to product list."
          fi
